[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrador"
version = "0.1.0"
description = "Turn any excel or csv into a sqlite database, while you see what you are doing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "click>=8.1",
    "textual>=0.60",
    "rich>=13.0",
]

[project.scripts]
migrador = "migrador.cli:cli"

[project.urls]
Homepage = "https://github.com/jwsteens/migrador"

[tool.setuptools]
license-files = []